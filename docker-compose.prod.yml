# ─────────────────────────────────────────────────────────────────────────────
# Beamline — Production Docker Compose
# Architecture: Next.js 16 + Django 6.1 DRF + PostgreSQL 18 + n8n + Traefik v3
# Domain Routing:
#   - Frontend:  https://beamline.musfiqdehan.com (and https://crm.musfiqdehan.com)
#   - Backend:   https://beamline.musfiqdehan.com/api (and /admin, /media, /static)
#   - n8n:       https://beamline.musfiqdehan.com/n8n
# ─────────────────────────────────────────────────────────────────────────────

name: beamline-prod

services:
  # ── PostgreSQL 18 Production Database ──────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: beamline_prod_db
    restart: always
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beamline_prod}
      POSTGRES_USER: ${POSTGRES_USER:-beamline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - beamline_prod_postgres_data:/var/lib/postgresql
    networks:
      - beamline_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-beamline_user} -d $${POSTGRES_DB:-beamline_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Django 6.1 + DRF 3.18 API Backend (Gunicorn WSGI) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: beamline-backend:prod
    container_name: beamline_prod_backend
    restart: always
    mem_limit: 768m
    cpus: 1.5
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      USE_SQLITE: "False"
      DJANGO_DEBUG: "False"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://beamline.musfiqdehan.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://beamline.musfiqdehan.com/api/v1}
    volumes:
      - beamline_prod_media_data:/app/media
      - ./docs:/docs:ro
    networks:
      - beamline_internal
      - traefik_proxy
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate --noinput &&
             /app/.venv/bin/python manage.py collectstatic --noinput &&
             exec /app/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8017 --workers 2 --threads 2 --max-requests 1000 --max-requests-jitter 100 --timeout 120 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8017/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    labels:
      - "autoheal=false"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Backend API, Django Admin, Media, and Static HTTPS Router
      - "traefik.http.routers.beamline-backend.rule=(Host(`beamline.musfiqdehan.com`) || Host(`crm.musfiqdehan.com`)) && (PathPrefix(`/api`) || PathPrefix(`/django-admin`) || PathPrefix(`/media`) || PathPrefix(`/static`))"
      - "traefik.http.routers.beamline-backend.entrypoints=websecure"
      - "traefik.http.routers.beamline-backend.tls=true"
      - "traefik.http.routers.beamline-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.beamline-backend.middlewares=security-headers@file,compress@file,api-ratelimit@file"
      - "traefik.http.routers.beamline-backend.priority=190"
      - "traefik.http.services.beamline-backend.loadbalancer.server.port=8017"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── n8n Workflow Automation Engine ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: beamline_prod_n8n
    restart: always
    mem_limit: 768m
    cpus: 1.0
    env_file:
      - .env.prod
    environment:
      - N8N_HOST=beamline.musfiqdehan.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://beamline.musfiqdehan.com/n8n/
      - WEBHOOK_URL=https://beamline.musfiqdehan.com/n8n/
      - N8N_RUNNERS_ENABLED=false
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000
    volumes:
      - beamline_prod_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - beamline_internal
      - traefik_proxy
    depends_on:
      - backend
    labels:
      - "autoheal=false"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Explicit redirect: /n8n without slash -> /n8n/
      - "traefik.http.middlewares.beamline-n8n-slash.redirectregex.regex=^https://([^/]+)/n8n$$"
      - "traefik.http.middlewares.beamline-n8n-slash.redirectregex.replacement=https://$$1/n8n/"
      - "traefik.http.middlewares.beamline-n8n-slash.redirectregex.permanent=true"
      # Strip /n8n prefix when forwarding to container
      - "traefik.http.middlewares.beamline-n8n-strip.stripprefix.prefixes=/n8n"
      # n8n HTTPS Router
      - "traefik.http.routers.beamline-n8n.rule=(Host(`beamline.musfiqdehan.com`) || Host(`crm.musfiqdehan.com`)) && PathPrefix(`/n8n`)"
      - "traefik.http.routers.beamline-n8n.entrypoints=websecure"
      - "traefik.http.routers.beamline-n8n.tls=true"
      - "traefik.http.routers.beamline-n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.beamline-n8n.middlewares=beamline-n8n-slash,beamline-n8n-strip,security-headers@file,compress@file"
      - "traefik.http.routers.beamline-n8n.priority=200"
      - "traefik.http.services.beamline-n8n.loadbalancer.server.port=5678"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js 16 Production Frontend (Bun Runtime) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://beamline.musfiqdehan.com/api/v1}
        NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:-https://beamline.musfiqdehan.com/n8n}
        NEXT_PUBLIC_NOTION_HUB_URL: ${NEXT_PUBLIC_NOTION_HUB_URL:-https://app.notion.com/p/Kevin-s-Construction-OS-Production-40a8194ec3e881e08797e4c0d8bc6c4e}
    image: beamline-frontend:prod
    container_name: beamline_prod_frontend
    restart: always
    mem_limit: 512m
    cpus: 1.0
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3017
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:8017
    networks:
      - beamline_internal
      - traefik_proxy
    depends_on:
      - backend
    labels:
      - "autoheal=false"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # HTTP -> HTTPS redirect for beamline.musfiqdehan.com and crm.musfiqdehan.com
      - "traefik.http.routers.beamline-frontend-http.rule=Host(`beamline.musfiqdehan.com`) || Host(`crm.musfiqdehan.com`)"
      - "traefik.http.routers.beamline-frontend-http.entrypoints=web"
      - "traefik.http.routers.beamline-frontend-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.beamline-frontend-http.priority=150"
      # Frontend HTTPS Router (Root and SPA pages)
      - "traefik.http.routers.beamline-frontend.rule=Host(`beamline.musfiqdehan.com`) || Host(`crm.musfiqdehan.com`)"
      - "traefik.http.routers.beamline-frontend.entrypoints=websecure"
      - "traefik.http.routers.beamline-frontend.tls=true"
      - "traefik.http.routers.beamline-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.beamline-frontend.middlewares=security-headers@file,compress@file"
      - "traefik.http.routers.beamline-frontend.priority=150"
      - "traefik.http.services.beamline-frontend.loadbalancer.server.port=3017"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # External shared Traefik proxy network
  traefik_proxy:
    external: true
    name: traefik_proxy

  # Private isolated network for inter-container communication & database protection
  beamline_internal:
    driver: bridge
    name: beamline_internal

volumes:
  beamline_prod_postgres_data:
    name: beamline_prod_postgres_data
  beamline_prod_media_data:
    name: beamline_prod_media_data
  beamline_prod_n8n_data:
    name: beamline_prod_n8n_data


