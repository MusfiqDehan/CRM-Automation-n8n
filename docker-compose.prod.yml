# ─────────────────────────────────────────────────────────────────────────────
# Kevin's Construction OS — Production Docker Compose
# Architecture: Next.js 16 + Django 6.1 DRF + PostgreSQL 18 + n8n + Traefik v3
# Domain Routing:
#   - Frontend:  https://crm.musfiqdehan.com
#   - Backend:   https://crm.musfiqdehan.com/api (and /admin, /media, /static)
#   - n8n:       https://crm.musfiqdehan.com/n8n
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 18 Production Database ──────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: crm_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kevin_construction_os_prod}
      POSTGRES_USER: ${POSTGRES_USER:-kevin_os_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - crm_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - crm_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kevin_os_user} -d $${POSTGRES_DB:-kevin_construction_os_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Django 6.1 + DRF 3.18 API Backend (Gunicorn WSGI) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: crm_prod_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      USE_SQLITE: "False"
      DJANGO_DEBUG: "False"
    volumes:
      - crm_prod_media_data:/app/media
      - ./docs:/docs:ro
    networks:
      - crm_internal
      - traefik_proxy
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run python manage.py provision_notion &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8017 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Backend API, Admin, Media, and Static HTTPS Router
      - "traefik.http.routers.crm-backend.rule=Host(`crm.musfiqdehan.com`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/media`) || PathPrefix(`/static`))"
      - "traefik.http.routers.crm-backend.entrypoints=websecure"
      - "traefik.http.routers.crm-backend.tls=true"
      - "traefik.http.routers.crm-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-backend.middlewares=security-headers@file,compress@file,api-ratelimit@file"
      - "traefik.http.routers.crm-backend.priority=190"
      - "traefik.http.services.crm-backend.loadbalancer.server.port=8017"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── n8n Workflow Automation Engine ─────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: crm_prod_n8n
    restart: always
    env_file:
      - .env.prod
    environment:
      - N8N_HOST=crm.musfiqdehan.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n/
      - N8N_EDITOR_BASE_URL=https://crm.musfiqdehan.com/n8n/
      - WEBHOOK_URL=https://crm.musfiqdehan.com/n8n/
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
    volumes:
      - crm_prod_n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - crm_internal
      - traefik_proxy
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Explicit redirect: /n8n without slash -> /n8n/
      - "traefik.http.middlewares.crm-n8n-slash.redirectregex.regex=^https://([^/]+)/n8n$$"
      - "traefik.http.middlewares.crm-n8n-slash.redirectregex.replacement=https://$$1/n8n/"
      - "traefik.http.middlewares.crm-n8n-slash.redirectregex.permanent=true"
      # n8n HTTPS Router
      - "traefik.http.routers.crm-n8n.rule=Host(`crm.musfiqdehan.com`) && PathPrefix(`/n8n`)"
      - "traefik.http.routers.crm-n8n.entrypoints=websecure"
      - "traefik.http.routers.crm-n8n.tls=true"
      - "traefik.http.routers.crm-n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-n8n.middlewares=crm-n8n-slash,security-headers@file,compress@file,ws-headers@file"
      - "traefik.http.routers.crm-n8n.priority=200"
      - "traefik.http.services.crm-n8n.loadbalancer.server.port=5678"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js 16 Production Frontend (Bun Runtime) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://crm.musfiqdehan.com/api/v1}
        NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:-https://crm.musfiqdehan.com/n8n}
        NEXT_PUBLIC_NOTION_HUB_URL: ${NEXT_PUBLIC_NOTION_HUB_URL:-https://app.notion.com/p/Kevin-s-Construction-OS-Production-40a8194ec3e881e08797e4c0d8bc6c4e}
    container_name: crm_prod_frontend
    restart: always
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3017
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:8017
    networks:
      - crm_internal
      - traefik_proxy
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # HTTP -> HTTPS redirect for crm.musfiqdehan.com
      - "traefik.http.routers.crm-frontend-http.rule=Host(`crm.musfiqdehan.com`)"
      - "traefik.http.routers.crm-frontend-http.entrypoints=web"
      - "traefik.http.routers.crm-frontend-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.crm-frontend-http.priority=150"
      # Frontend HTTPS Router (Root and SPA pages)
      - "traefik.http.routers.crm-frontend.rule=Host(`crm.musfiqdehan.com`)"
      - "traefik.http.routers.crm-frontend.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend.tls=true"
      - "traefik.http.routers.crm-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crm-frontend.middlewares=security-headers@file,compress@file"
      - "traefik.http.routers.crm-frontend.priority=150"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=3017"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # External shared Traefik proxy network
  traefik_proxy:
    external: true
    name: traefik_proxy

  # Private isolated network for inter-container communication & database protection
  crm_internal:
    driver: bridge
    name: crm_internal

volumes:
  crm_prod_postgres_data:
    name: crm_prod_postgres_data
  crm_prod_media_data:
    name: crm_prod_media_data
  crm_prod_n8n_data:
    name: crm_prod_n8n_data

